<div class="hl-bg {{parity}}"></div>
<div class="corner {{parity}}"></div>
<div class="stage hl {{parity}}">
  <div class="hl-top">
    <span class="num">{{indexPadded}}</span>
    <span class="kind kind-{{kind}}"><span class="sr-icon kind-icon">{{{icon}}}</span>{{kindLabel}}</span>
  </div>
  <p class="hl-text size-{{textSize}}" data-split="words">{{text}}</p>
  <div class="bars">{{#dots}}<i class="{{#active}}on{{/active}}{{#done}}done{{/done}}"></i>{{/dots}}</div>
</div>
