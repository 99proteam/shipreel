<div class="window">
  <div class="bar"><i></i><i></i><i></i><span class="title">~/{{projectName}}</span></div>
  <div class="term">
    <div class="line"><span class="ps">$</span> <span class="typed" data-split="chars">git log --oneline | grep -c fix</span></div>
    <div class="fix-number"><span class="brand">+</span><span class="sr-counter count" style="--target: {{fixCount}}"></span></div>
    <div class="fix-label">{{fixLabel}} squashed<span class="cursor"></span></div>
  </div>
</div>
